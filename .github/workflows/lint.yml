name: Lint

# Validate the reusable workflows before they can merge -- since callers track
# @v0, a broken workflow would auto-propagate to every repo. actionlint catches
# syntax/structure errors here first.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

  # Run the go-ci gitleaks scan step against fixture repositories, so a change
  # that stops it catching a secret (or starts failing clean repos) is caught
  # here rather than in every caller at once.
  gitleaks-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: Install gitleaks at go-ci's default version
        run: |
          set -euo pipefail
          # The version callers get, read from go-ci.yml so the two never drift.
          v=$(yq -r '.on.workflow_call.inputs.gitleaks_version.default' .github/workflows/go-ci.yml)
          go install "github.com/zricethezav/gitleaks/v8@${v}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test the scan step
        run: tests/gitleaks-step.sh
