name: Lint

# Validate the reusable workflows before they can merge -- since callers track
# @v0, a broken workflow would auto-propagate to every repo. actionlint catches
# syntax/structure errors here first.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

  # Run the gitleaks.yml scan step against fixture repositories, so a change
  # that stops it catching a secret (or starts failing clean repos) is caught
  # here rather than in every caller at once.
  gitleaks-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: gitleaks_version defaults agree
        run: |
          set -euo pipefail
          # go-ci.yml passes its own gitleaks_version through to gitleaks.yml,
          # so its default is what Go callers get. The two must match or the
          # scanner version depends on which entry point a repo uses.
          a=$(yq -r '.on.workflow_call.inputs.gitleaks_version.default' .github/workflows/gitleaks.yml)
          b=$(yq -r '.on.workflow_call.inputs.gitleaks_version.default' .github/workflows/go-ci.yml)
          if [ "$a" != "$b" ]; then
            echo "::error::gitleaks_version default is ${a} in gitleaks.yml but ${b} in go-ci.yml; bump both together."
            exit 1
          fi
          echo "both default to ${a}"
      - name: Install gitleaks at the default version
        run: |
          set -euo pipefail
          v=$(yq -r '.on.workflow_call.inputs.gitleaks_version.default' .github/workflows/gitleaks.yml)
          go install "github.com/zricethezav/gitleaks/v8@${v}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test the scan step
        run: tests/gitleaks-step.sh
