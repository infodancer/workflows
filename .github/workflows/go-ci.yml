name: Go CI (reusable)

# Shared Go CI: test + vet + fmt + lint + govulncheck, factored out of the
# near-identical per-repo copies. Every job fans out over a module matrix
# (default a single root module) with GOWORK=off, so a repo's local go.work is
# ignored and each module builds against its own go.mod -- matching how the
# multi-module repos (e.g. infodancer/ui) already run.
#
# The test job is the one with real per-repo variance (service containers,
# coverage upload, env). Service containers can't be passed into a reusable
# workflow, so DB-backed repos set run_tests=false and keep their own test
# workflow, calling this only for the static-analysis quartet.

on:
  workflow_call:
    inputs:
      modules:
        description: Go module directories to check, as a JSON array string.
        required: false
        type: string
        default: '["."]'
      go_version:
        description: >-
          Go version for test/vet/fmt/lint. Defaults to "stable" so CI tracks
          the current release instead of whatever patch a module's go.mod
          happens to name. Set "" to fall back to each module's go.mod (via
          go-version-file) -- do that for a module that deliberately supports
          an older Go, so CI actually exercises the version it claims. Or set
          an exact version to pin.
        required: false
        type: string
        default: "stable"
      govulncheck_go_version:
        description: >-
          Go version for govulncheck. Defaults to "stable": stdlib advisories
          are fixed by the newest patch, so scanning current release means they
          resolve themselves rather than needing a go.mod bump in every repo.
          Dependency advisories are unaffected and still gate normally.
          IMPORTANT -- scan with the toolchain you SHIP. Scanning newer than
          the shipped artifact hides stdlib vulnerabilities that are real in
          production, so a module whose Dockerfile pins an older `FROM golang:`
          must set this to match. Set "" to use go.mod.
        required: false
        type: string
        default: "stable"
      golangci_version:
        description: golangci-lint version.
        required: false
        type: string
        default: v2.13.1
      run_tests:
        description: >-
          Run the stateless `go test -race -count=1 ./...` job. Set false for
          repos whose tests need a service container; they keep their own test
          workflow.
        required: false
        type: boolean
        default: true
      run_govulncheck:
        description: >-
          Run the `govulncheck ./...` (source mode) job. Set false for repos
          that must scan in binary mode -- e.g. those whose tests pull
          testcontainers/moby transitively, where source mode surfaces
          server-side CVEs unreachable from the shipped binary; they keep their
          own govulncheck workflow. Prefer govulncheck_allow (below) when you
          still want those findings reported, just not gating.
        required: false
        type: boolean
        default: true
      govulncheck_allow:
        description: >-
          OSV IDs (JSON array string, e.g. '["GO-2026-5746"]') to report but not
          gate on. Allow-listed findings still print and are annotated as
          warnings for visibility; they just don't fail the job. Use for vulns
          with no available fix, or reachable only through test-support code
          (e.g. testcontainers/moby). Everything else still gates, so a fixable
          production vuln is never silently ignored.
        required: false
        type: string
        default: '[]'
      allow_local_replace:
        description: >-
          Module paths (JSON array string, e.g. '["github.com/acme/thing"]')
          permitted to keep a filesystem replace pointing outside the repo.
          Use only for a module being actively co-developed, and remove the
          entry when it is tagged -- an entry here disables the protection for
          that dependency entirely.
        required: false
        type: string
        default: '[]'
      check_go_consistency:
        description: >-
          Fail when the repo's go.mod files do not all declare the same go
          directive. Off by default: a repo whose modules legitimately differ,
          or one caught mid-bump, would otherwise go red on a change it never
          made. Turn it on where the version moves in lockstep.
        required: false
        type: boolean
        default: false
      go_version_doc:
        description: >-
          Path to a doc that must name the version the modules declare, e.g.
          "CONVENTIONS.md". Only consulted when check_go_consistency is true;
          empty checks the modules against each other and no further.
        required: false
        type: string
        default: ""
      runner:
        description: >-
          runs-on labels, as a JSON array string. Defaults to the self-hosted CI
          pool so callers do not consume GitHub-hosted minutes; override with
          '["ubuntu-latest"]' for GitHub-hosted, or e.g. '["self-hosted","ci"]'
          for a pool without the "linux" label.
        required: false
        type: string
        default: '["self-hosted", "linux", "ci"]'

permissions:
  contents: read

jobs:
  # Resolve the toolchain ONCE per run rather than once per matrix job.
  #
  # check-latest makes setup-go consult GitHub's version manifest before it
  # looks in the runner's tool cache. That is the only network dependency in an
  # otherwise local step, and a wide matrix multiplies it: infodancer/web fans
  # out to ~90 jobs that all resolve the same "stable". Under that load the
  # call has been seen to stall for minutes and then return WITHOUT installing
  # Go -- no "Found in cache", no "Added go to the path", no error, exit status
  # 0 -- after which the job keeps going until the first go/gofmt call dies
  # with exit 127 several steps later. Observed 2026-09-12 on infodancer/web
  # across three different runners, while a job on one of those same runners
  # succeeded three minutes earlier.
  #
  # Resolving here and passing the exact patch down keeps what #11 bought
  # (never building on a stale cached patch under GOTOOLCHAIN=local) while
  # turning every other job's setup-go into a pure tool-cache lookup.
  #
  # When a caller clears go_version to follow each module's own go.mod there is
  # nothing to resolve centrally -- modules may legitimately name different
  # versions -- so the output stays empty and those jobs keep check-latest for
  # themselves. That is the one path that still pays per job.
  resolve-go:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      go_version: ${{ steps.build.outputs.version }}
      govulncheck_go_version: ${{ steps.vuln.outputs.version }}
    steps:
      - if: ${{ inputs.go_version != '' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true
          cache: false
      - id: build
        if: ${{ inputs.go_version != '' }}
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but installed no Go (go_version=${{ inputs.go_version }}). This is the silent-failure mode this job exists to catch."
            exit 1
          }
          go version
          echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - if: ${{ inputs.govulncheck_go_version != '' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.govulncheck_go_version }}
          check-latest: true
          cache: false
      - id: vuln
        if: ${{ inputs.govulncheck_go_version != '' }}
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but installed no Go (govulncheck_go_version=${{ inputs.govulncheck_go_version }})."
            exit 1
          }
          go version
          echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-go
    if: ${{ inputs.run_tests }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
      # Disable the shared Ryuk reaper. testcontainers-go names one reaper per
      # `go test` session (reaper_<sessionID>, hashed from the go-test parent
      # pid), shared across every package binary in the run, and starts it
      # check-then-create. A module whose `go test ./...` boots containers in
      # two packages at once races: both see no reaper, both create the
      # same-named container, and the loser dies on a Docker 409 conflict.
      # DB-backed tests terminate their own containers on the normal path, so
      # Ryuk only mattered for a killed/timed-out run leaking a container on the
      # persistent runner -- the reap step below covers that, bounded by
      # container age.
      #
      # An earlier version of this comment claimed each matrix module gets "its
      # own LXC runner (isolated dockerd, one job per runner), so the label
      # filter only sees this job's containers". That is false where several
      # runners share a host -- the CI LXCs run 6-8 runner accounts against one
      # /var/run/docker.sock -- and acting on it is what made the reap step
      # delete other jobs' live containers (#18, fixed in #19). Do not
      # reintroduce that assumption anywhere in this file.
      #
      # Same Ryuk fix as infodancer/web#90 / old-school-gamers/osg#420.
      # Harmless for repos whose tests use no containers.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go. Empty when the caller
          # cleared go_version, and then go-version-file below applies per
          # module -- the only path that still resolves per job.
          go-version: ${{ needs.resolve-go.outputs.go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          # go-version wins when both are set, so go-version-file only applies
          # when a caller clears go_version to follow its own go.mod. That path
          # keeps check-latest, for the reason #11 added it: it installs the
          # newest patch rather than whatever go1.MINOR.x a runner has cached,
          # and under GOTOOLCHAIN=local a stale cache makes the build refuse to
          # run, so a security patch bump would otherwise fail on some runners
          # and not others. With go_version set, resolve-go already did that
          # lookup once and this is a tool-cache hit with no network call.
          check-latest: ${{ inputs.go_version == '' }}
          # Persistent self-hosted runner: Go's own module and build caches
          # already persist on disk between jobs, so setup-go's tar-based cache
          # is redundant -- its restore collides with the populated dirs ("tar:
          # ... Cannot open: File exists") and its save re-uploads ~1.8 GB every
          # job (~2.5 min). Same cold-cache stance as the lint job's skip-cache;
          # Go's on-disk caches are concurrency-safe, so only the redundant
          # actions layer is disabled.
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      # Without this the job runs on and dies later in an unrelated step with a
      # bare "gofmt: No such file or directory" and exit 127, which reads as a
      # repo problem rather than a toolchain one. Fail here instead, loudly.
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - name: Test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      # Reap testcontainers a killed, panicked, or timed-out run left behind.
      # With Ryuk disabled nothing else cleans these up on a persistent runner.
      #
      # ONLY containers older than REAP_MIN_AGE are removed, and that bound is
      # the whole point -- do not "simplify" this back to removing everything
      # carrying the testcontainers label.
      #
      # This step used to do exactly that, on the stated assumption of "one job
      # per runner, isolated dockerd, so the label filter only sees this job's
      # containers". That assumption is false wherever several runners share a
      # host: infodancer's CI LXCs run 8 runner accounts against a single
      # /var/run/docker.sock. A blanket `docker rm -f` therefore killed the
      # live Postgres containers of the 7 other jobs still running, and the
      # victim was whichever job was unlucky -- surfacing as three unrelated
      # looking failures depending on when the reap landed:
      #
      #   wait until ready: context deadline exceeded   (killed during startup)
      #   port "5432/tcp" not found                     (killed before port lookup)
      #   unexpected EOF / connection reset by peer     (killed mid-test)
      #
      # Diagnosed against instrumented runs: CPU, IO and memory pressure were
      # all flat at the moment of failure, which is what ruled out resource
      # exhaustion and pointed here (infodancer/workflows#18).
      #
      # Age is the scoping mechanism because the precise one is not reachable
      # from a shell step: testcontainers labels each container with
      # org.testcontainers.sessionId, but that value is a sha256 of the
      # `go test` parent pid and its process start time, so only the test
      # process itself can compute it. An age bound gets the property that
      # matters -- a container younger than the cutoff may belong to a live
      # job, so it is never touched -- without needing to identify ownership.
      # Jobs here finish in well under a minute, so an hour is a wide margin;
      # anything genuinely leaked is collected by a later job's reap.
      #
      # `docker ps` has no `until` filter (that is prune-only), hence the
      # explicit per-container timestamp comparison.
      - name: Reap stale testcontainers
        if: always()
        env:
          REAP_MIN_AGE: 1 hour ago
        run: |
          cutoff=$(date -u -d "$REAP_MIN_AGE" +%s)
          for id in $(docker ps -aq --filter label=org.testcontainers=true); do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null) || continue
            ts=$(date -u -d "$created" +%s 2>/dev/null) || continue
            if [ "$ts" -lt "$cutoff" ]; then
              echo "reaping stale container $id (created $created)"
              docker rm -f "$id" || true
            fi
          done

  vet:
    needs: resolve-go
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go. Empty when the caller
          # cleared go_version, and then go-version-file below applies per
          # module -- the only path that still resolves per job.
          go-version: ${{ needs.resolve-go.outputs.go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          # go-version wins when both are set, so go-version-file only applies
          # when a caller clears go_version to follow its own go.mod. That path
          # keeps check-latest, for the reason #11 added it: it installs the
          # newest patch rather than whatever go1.MINOR.x a runner has cached,
          # and under GOTOOLCHAIN=local a stale cache makes the build refuse to
          # run, so a security patch bump would otherwise fail on some runners
          # and not others. With go_version set, resolve-go already did that
          # lookup once and this is a tool-cache hit with no network call.
          check-latest: ${{ inputs.go_version == '' }}
          # Persistent self-hosted runner: Go's own module and build caches
          # already persist on disk between jobs, so setup-go's tar-based cache
          # is redundant -- its restore collides with the populated dirs ("tar:
          # ... Cannot open: File exists") and its save re-uploads ~1.8 GB every
          # job (~2.5 min). Same cold-cache stance as the lint job's skip-cache;
          # Go's on-disk caches are concurrency-safe, so only the redundant
          # actions layer is disabled.
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - name: Vet (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  fmt:
    needs: resolve-go
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go. Empty when the caller
          # cleared go_version, and then go-version-file below applies per
          # module -- the only path that still resolves per job.
          go-version: ${{ needs.resolve-go.outputs.go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          # go-version wins when both are set, so go-version-file only applies
          # when a caller clears go_version to follow its own go.mod. That path
          # keeps check-latest, for the reason #11 added it: it installs the
          # newest patch rather than whatever go1.MINOR.x a runner has cached,
          # and under GOTOOLCHAIN=local a stale cache makes the build refuse to
          # run, so a security patch bump would otherwise fail on some runners
          # and not others. With go_version set, resolve-go already did that
          # lookup once and this is a tool-cache hit with no network call.
          check-latest: ${{ inputs.go_version == '' }}
          # Persistent self-hosted runner: Go's own module and build caches
          # already persist on disk between jobs, so setup-go's tar-based cache
          # is redundant -- its restore collides with the populated dirs ("tar:
          # ... Cannot open: File exists") and its save re-uploads ~1.8 GB every
          # job (~2.5 min). Same cold-cache stance as the lint job's skip-cache;
          # Go's on-disk caches are concurrency-safe, so only the redundant
          # actions layer is disabled.
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      # This is the job where that bit hardest: gofmt vanishing turns into
      # "xargs: gofmt: No such file or directory" and exit 127, which looks
      # like a formatting failure rather than a missing toolchain.
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - name: Check formatting (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          # gofmt is a plain filesystem walk with no concept of Go module
          # boundaries or vendoring -- unlike go vet/build/golangci-lint,
          # which all skip vendor/ automatically. A vendored repo would
          # otherwise fail here on third-party code's own formatting, not
          # anything this repo authored.
          unformatted=$(find . -name '*.go' -not -path '*/vendor/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    needs: resolve-go
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go. Empty when the caller
          # cleared go_version, and then go-version-file below applies per
          # module -- the only path that still resolves per job.
          go-version: ${{ needs.resolve-go.outputs.go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          # go-version wins when both are set, so go-version-file only applies
          # when a caller clears go_version to follow its own go.mod. That path
          # keeps check-latest, for the reason #11 added it: it installs the
          # newest patch rather than whatever go1.MINOR.x a runner has cached,
          # and under GOTOOLCHAIN=local a stale cache makes the build refuse to
          # run, so a security patch bump would otherwise fail on some runners
          # and not others. With go_version set, resolve-go already did that
          # lookup once and this is a tool-cache hit with no network call.
          check-latest: ${{ inputs.go_version == '' }}
          # Persistent self-hosted runner: Go's own module and build caches
          # already persist on disk between jobs, so setup-go's tar-based cache
          # is redundant -- its restore collides with the populated dirs ("tar:
          # ... Cannot open: File exists") and its save re-uploads ~1.8 GB every
          # job (~2.5 min). Same cold-cache stance as the lint job's skip-cache;
          # Go's on-disk caches are concurrency-safe, so only the redundant
          # actions layer is disabled.
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        env:
          # Per-job analysis cache (step-level env: the runner context is not
          # available in job env). golangci-lint's default cache dir lives
          # under the runner user's home, shared by every concurrent lint job
          # on a self-hosted host. Under concurrent access staticcheck can
          # load damaged per-package facts -- observed 2026-07-19 in memstore
          # as nondeterministic SA5011 false positives ("(*testing.common)
          # .Fatal does not return" fact lost) that came and went across runs
          # on identical code and identical pinned tool versions. runner.temp
          # is unique per job and wiped after it, so each run pays a cold
          # cache (~30-60s) and shares nothing.
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        with:
          version: ${{ inputs.golangci_version }}
          working-directory: ${{ matrix.module }}
          # The action's default `verify: true` fetches the config JSONSchema
          # from golangci-lint.run on every run, so a slow response from that
          # host fails the lint job -- a red X that reads like a lint finding
          # on a PR that changed no Go code. Validating a checked-in config
          # file is a developer-time concern; run `golangci-lint config verify`
          # locally when editing .golangci.yml. A genuinely broken config still
          # fails the lint run itself.
          verify: false
          # golangci-lint refuses to start while another instance is running on
          # the host ("parallel golangci-lint is running") -- a guard keyed on
          # the host, not on GOLANGCI_LINT_CACHE, so the per-job cache dir above
          # does not avoid it. A caller with more than one module in `modules`
          # runs exactly that: two lint jobs, same self-hosted host, same
          # moment. Observed 2026-09-12 on infodancer/logging with modules
          # ["." , "httplog"], where both lint jobs failed within a second of
          # each other and failed again on rerun. The flag is upstream's own
          # remedy, and the isolation that made the guard matter -- a shared
          # analysis cache -- is already handled above.
          args: --allow-parallel-runners
          # Don't restore/save the analysis cache through the actions cache
          # service either -- a restored archive would land in the per-job
          # GOLANGCI_LINT_CACHE dir above and defeat its isolation, and
          # concurrent jobs racing on the same cache key is the suspected
          # corruption vector in the first place. Every lint run is cold on
          # purpose.
          skip-cache: true

  govulncheck:
    needs: resolve-go
    if: ${{ inputs.run_govulncheck }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go, from
          # govulncheck_go_version rather than go_version: this job scans with
          # the toolchain the repo SHIPS, which a caller may pin older.
          go-version: ${{ needs.resolve-go.outputs.govulncheck_go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          # See the build jobs above. Matters most here: scanning against a
          # stale cached toolchain would report stdlib vulnerabilities already
          # fixed in the patch we actually ship. resolve-go did that lookup
          # once; check-latest stays only for the per-module go.mod path.
          check-latest: ${{ inputs.govulncheck_go_version == '' }}
          # Persistent self-hosted runner: Go's own module and build caches
          # already persist on disk between jobs, so setup-go's tar-based cache
          # is redundant -- its restore collides with the populated dirs ("tar:
          # ... Cannot open: File exists") and its save re-uploads ~1.8 GB every
          # job (~2.5 min). Same cold-cache stance as the lint job's skip-cache;
          # Go's on-disk caches are concurrency-safe, so only the redundant
          # actions layer is disabled.
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      # Without this the next step dies as "go: command not found" while
      # installing govulncheck, which reads as a tooling-download problem.
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        env:
          GOVULN_ALLOW: ${{ inputs.govulncheck_allow }}
        run: |
          set -uo pipefail
          # Human-readable pass for the job log (visibility); never gates on its
          # own -- the JSON pass below decides pass/fail.
          govulncheck ./... || true
          # Machine-readable pass drives the gate.
          govulncheck -format json ./... > govulncheck.json || true
          # OSV IDs whose vulnerable symbols are actually called (govulncheck's
          # own exit-3 criterion): a finding with a function at trace[0].
          called=$(jq -r 'select(has("finding")) | .finding
            | select(.trace[0].function != null) | .osv' govulncheck.json \
            | sort -u)
          allow=$(printf '%s' "${GOVULN_ALLOW:-[]}" | jq -r '.[]')
          status=0
          for id in $called; do
            if printf '%s\n' "$allow" | grep -qxF "$id"; then
              echo "::warning::${id} is reachable but allow-listed (reported, not gated)"
            else
              echo "::error::${id} is reachable and not allow-listed"
              status=1
            fi
          done
          exit $status

  # A filesystem `replace` pointing outside the repo makes the build depend on
  # what happens to be in a sibling directory on one developer's disk. Nothing
  # fails when it drifts, which is the problem: the module graph names a version
  # nobody is actually compiling.
  #
  # Vendoring hides it completely. CI and the container image build from
  # vendor/ and never resolve the replace target at all, so the vendored copy
  # and the named version can diverge indefinitely with every check green.
  # old-school-gamers/osg carried `smoke => ../../../infodancer/smoke` pinned at
  # v0.0.0 while the vendored tree sat nine commits past the v0.1.0 tag -- among
  # them a go1.26.5 bump for CVE-2026-42505. A security fix was in the binary
  # and invisible to anything reading go.mod.
  #
  # Replaces pointing INSIDE the repo are fine and deliberately allowed: that is
  # how the multi-module repos develop sibling modules against each other
  # (infodancer/web's `web/blog` -> `../media`). Only targets that escape the
  # repository root are rejected, so monorepo layouts are unaffected.
  #
  # Module-to-module replaces with a version (`replace a => b v1.2.3`) are not
  # filesystem paths and are left alone.
  replace-check:
    needs: resolve-go
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      GOWORK: "off"
      ALLOW_LOCAL_REPLACE: ${{ inputs.allow_local_replace }}
    strategy:
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # The exact patch resolved once by resolve-go; empty when the caller
          # cleared go_version, and then go-version-file applies per module.
          go-version: ${{ needs.resolve-go.outputs.go_version }}
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: ${{ inputs.go_version == '' }}
          cache: false
      # setup-go can report success having installed nothing (see resolve-go).
      - name: Verify the Go toolchain is installed
        run: |
          set -euo pipefail
          command -v go >/dev/null || {
            echo "::error::setup-go reported success but Go is not on PATH -- the toolchain was not installed."
            exit 1
          }
          go version
      - name: No external filesystem replace (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          moddir=$(pwd)
          status=0

          # `go mod edit -json` rather than grepping go.mod: it survives
          # comments, block vs single-line syntax, and quoting.
          replaces=$(go mod edit -json | jq -r '
            (.Replace // [])[]
            | select(.New.Path | test("^(\\./|\\.\\./|/)"))
            | "\(.Old.Path)\t\(.New.Path)"')

          allow=$(printf '%s' "${ALLOW_LOCAL_REPLACE:-[]}" | jq -r '.[]' || true)

          while IFS=$'\t' read -r old new; do
            [ -n "$old" ] || continue
            target=$(realpath -m "$moddir/$new")
            case "$target" in
              "$root"|"$root"/*)
                continue
                ;;
            esac
            if printf '%s\n' "$allow" | grep -qxF "$old"; then
              echo "::warning::${old} => ${new} escapes the repo but is allow-listed; remove the entry once it is tagged"
              continue
            fi
            echo "::error::${old} => ${new} resolves to ${target}, outside this repository."
            echo "::error::Tag the dependency and require the version instead. A local replace builds only on a machine with that checkout, and vendoring hides the drift."
            status=1
          done <<< "$replaces"

          if [ "$status" -eq 0 ]; then
            echo "replace check passed"
          fi
          exit $status

  # One Go version across the repo, and docs that say the same number.
  #
  # Two failures this catches, both seen in infodancer/web:
  #
  #   - A module left behind by a suite-wide bump. media/cmd/media-import sat
  #     at go 1.26.5 while the parent it resolves through `replace ../..`
  #     required 1.26.6. Go honours the DECLARING module's directive, so every
  #     command in that directory died at load time -- build, test, vet and
  #     govulncheck alike -- and the module was not in the matrix, so nothing
  #     reported it. It was the only module disagreeing with its siblings,
  #     which is exactly what this job looks for (infodancer/web#111).
  #
  #   - Docs drifting from the code. CONVENTIONS.md named a version the
  #     modules had moved past three separate times (infodancer/web#86, #111),
  #     because correcting the number is a manual step nothing enforces.
  #
  # Needs no Go toolchain: it reads go.mod as text, so there is no setup-go
  # here and no dependency on resolve-go.
  go-consistency:
    if: ${{ inputs.check_go_consistency }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: One Go version across every go.mod
        env:
          VERSION_DOC: ${{ inputs.go_version_doc }}
        run: |
          set -euo pipefail

          # Tracked files only: an untracked scratch checkout (an agent
          # worktree, a stray vendored tree) must not be able to fail the
          # build. testdata and vendor are excluded -- those go.mod files are
          # fixtures and third-party code, pinned to whatever they need.
          mods=$(git ls-files '*go.mod' \
            | grep -v -e '^testdata/' -e '/testdata/' -e '^vendor/' -e '/vendor/' || true)

          if [ -z "$mods" ]; then
            echo "no go.mod files tracked; nothing to check"
            exit 0
          fi

          versions=$(printf '%s\n' "$mods" | xargs grep -h '^go ' | awk '{print $2}' | sort -u)

          if [ -z "$versions" ]; then
            echo "::error::Found go.mod files but none declares a go directive."
            exit 1
          fi

          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::Modules disagree on the Go version; the go directive must match across the repo."
            while read -r m; do
              printf '  %-52s %s\n' "$m" "$(grep -m1 '^go ' "$m" | awk '{print $2}')"
            done <<< "$mods"
            echo "::error::A module left behind by a bump stops building against any sibling that requires the newer version."
            exit 1
          fi

          echo "all modules declare go ${versions}"

          [ -n "${VERSION_DOC:-}" ] || exit 0

          if [ ! -f "$VERSION_DOC" ]; then
            echo "::error::go_version_doc is set to '${VERSION_DOC}', which does not exist in this repo."
            exit 1
          fi

          # Substring match, not an exact-equality check on every version-like
          # string in the file: docs legitimately cite older versions in
          # changelogs and history, and failing on those would make the gate
          # something people switch off. The claim being enforced is that the
          # current version appears at all.
          if ! grep -qF "$versions" "$VERSION_DOC"; then
            echo "::error file=${VERSION_DOC}::${VERSION_DOC} never mentions go ${versions}, which every go.mod declares. Update it in the same change as the bump."
            echo "Version-like strings currently in ${VERSION_DOC}:"
            grep -nE '\b1\.[0-9]+(\.[0-9]+)?\b' "$VERSION_DOC" | head -5 || true
            exit 1
          fi

          echo "${VERSION_DOC} mentions go ${versions}"
